<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Writing and notes." />
    <title>Log</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="home">
    <header class="site-header">
      <h1 class="site-name">
        <a href="index.html"><span data-site-name>Dellar Zvinavashe</span></a>
      </h1>
      <p class="site-tagline" data-site-tagline>Writer / editor / DJ</p>
      <nav class="nav-wrap" aria-label="Site">
        <ul id="site-nav" class="site-nav"></ul>
      </nav>
    </header>

    <div class="filter-bar" role="navigation" aria-label="Archive">
      <span class="filter-intro">View · </span>
      <ul class="filter-list">
        <li><a href="index.html#newest">Newest</a></li>
        <li><a href="index.html#popular">Popular</a></li>

    <main>
      <noscript>
        <p class="article-body">
          Turn on JavaScript to load posts from <code>content.js</code>, or open
          <a href="post.html#welcome">post.html#welcome</a>.
        </p>

      <section id="newest" class="feed" aria-label="Newest posts">
        <ul id="feed-newest" class="post-list"></ul>
      </section>

      <section id="popular" class="feed" aria-label="Popular posts">
        <ul id="feed-popular" class="post-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-legal">
          <span data-footer-line>© 2026 Dellar Zvinavashe</span>
        </div>
        <p class="footer-credit" data-developer-credit>

        </p>
      </div>

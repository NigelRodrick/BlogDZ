<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Article" />
    <title>Article</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="post">
    <header class="site-header">
      <h1 class="masthead">
        <a href="index.html">
          <span class="masthead-brand" data-site-brand>YOUR</span>
          <span class="masthead-suffix" data-site-suffix> Blog</span>
        </a>
      </h1>
      <div class="header-tools">
        <a href="index.html">All posts</a>
        <a href="posts/about.html">About</a>
      </div>
    </header>

    <main>
      <noscript>
        <p class="article-body">
          Turn on JavaScript to read articles from <code>content.js</code>.
        </p>
      </noscript>
      <div id="article-root"></div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-newsletter">
          <h2>Sign up for email updates</h2>
          <p>
            Get a note when new posts go live. Wire this form to your provider
            when you are ready.
          </p>
          <form class="newsletter-form" action="#" method="post">
            <label>
              <span class="visually-hidden">Email</span>
              <input type="email" name="email" placeholder="Email address" autocomplete="email" />
            </label>
            <button type="button">Sign up</button>
          </form>
        </div>

        <div class="footer-follow">
          <h3>Follow</h3>
          <ul class="social-list">
            <li><a href="#">YouTube</a></li>
            <li><a href="#">Instagram</a></li>
            <li><a href="#">LinkedIn</a></li>
            <li><a href="#">RSS</a></li>
          </ul>
        </div>

        <div class="footer-legal">
          <span data-footer-line>© 2026 Your Name</span>
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Contact</a>
        </div>
      </div>
    </footer>

    <script src="content.js"></script>
    <script src="js/blog.js"></script>
  </body>
</html>
